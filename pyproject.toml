[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sm-plugin"
version = "0.1.0"
description = "Read Skills Manager presets and launch per-process additive skill bundles"
requires-python = ">=3.11"
dependencies = ["websockets>=14,<17"]
readme = "README.md"

[project.scripts]
sm-plugin = "sm_plugin:entrypoint"

[tool.setuptools]
py-modules = ["sm_plugin"]
